<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>拾音图标源稿 v4</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  svg { display: block; }
</style>
</head>
<body>
<!--
  拾音应用图标 v4（2026-09-01）：
  设计语言 = 麦克风 + 声波扩散（"拾音"语义），亮青蓝渐变圆角方块（透明背景，无白底无边框）。
  小尺寸（16/32px）使用独立简化版源稿 icon-source-mini.html（胶囊麦克风 + 一道声波）。
-->
<svg id="icon-full" width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#8fdcfa"/>
      <stop offset="0.45" stop-color="#55b3ee"/>
      <stop offset="1" stop-color="#3f8fdc"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf6ff"/>
    </linearGradient>
  </defs>

  <!-- 圆角底：亮青蓝渐变，圆角外透明 -->
  <rect x="14" y="14" width="484" height="484" rx="120" fill="url(#bg)"/>
  <!-- 顶部柔和高光 -->
  <rect x="14" y="14" width="484" height="230" rx="120" fill="url(#sheen)"/>

  <!-- 声波弧线（右侧扩散，圆心=麦克风头部中心 256,216） -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M 300 132 A 98 98 0 0 1 300 300" stroke-width="15" stroke-opacity="0.9"/>
    <path d="M 314 104 A 128 128 0 0 1 314 328" stroke-width="13" stroke-opacity="0.55"/>
    <path d="M 330 74 A 160 160 0 0 1 330 358" stroke-width="11" stroke-opacity="0.3"/>
  </g>

  <!-- 麦克风：U 形支架 + 胶囊头部（居中偏左，让出声波空间） -->
  <g>
    <!-- U 形支架（两条对称弧线，底部汇聚） -->
    <path d="M 208 262 C 196 330 208 376 256 384" fill="none" stroke="url(#mic)" stroke-width="26" stroke-linecap="round"/>
    <path d="M 304 262 C 316 330 304 376 256 384" fill="none" stroke="url(#mic)" stroke-width="26" stroke-linecap="round"/>
    <!-- 底部声波脉冲点 -->
    <circle cx="256" cy="424" r="13" fill="#ffffff" fill-opacity="0.85"/>
    <circle cx="216" cy="424" r="8" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="296" cy="424" r="8" fill="#ffffff" fill-opacity="0.5"/>
    <!-- 胶囊头部（圆头麦克风） -->
    <rect x="206" y="146" width="100" height="132" rx="50" fill="url(#mic)"/>
    <!-- 头部高光 -->
    <rect x="218" y="158" width="26" height="96" rx="13" fill="#ffffff" fill-opacity="0.55"/>
  </g>
</svg>
</body>
</html>
