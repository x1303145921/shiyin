<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>拾音图标源稿</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
</style>
</head>
<body>
<!-- 512x512 应用图标 v2：亮蓝渐变圆角方块（透明背景）+ 白色音符声波 -->
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fc0f2"/>
      <stop offset="0.5" stop-color="#52a5e8"/>
      <stop offset="1" stop-color="#3f8edc"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 圆角底：亮蓝渐变，圆角外为透明（无白底无边框） -->
  <rect x="12" y="12" width="488" height="488" rx="118" fill="url(#bg)"/>
  <!-- 顶部柔和高光 -->
  <rect x="12" y="12" width="488" height="244" rx="118" fill="url(#sheen)"/>

  <!-- 声波纹（从音符扩散，白色半透明，圆滑） -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M 356 222 A 128 128 0 0 1 356 334" stroke-width="16" stroke-opacity="0.30"/>
    <path d="M 376 202 A 152 152 0 0 1 376 354" stroke-width="14" stroke-opacity="0.20"/>
    <path d="M 396 182 A 176 176 0 0 1 396 374" stroke-width="12" stroke-opacity="0.12"/>
  </g>

  <!-- 音符：白色，略放大更醒目 -->
  <g fill="#ffffff">
    <ellipse cx="200" cy="356" rx="54" ry="40" transform="rotate(-18 200 356)"/>
    <rect x="242" y="168" width="34" height="192" rx="17"/>
    <path d="M 242 190 Q 316 178 348 150 Q 316 206 276 214 Z"/>
  </g>

  <!-- 底部小圆点（声波起点，点睛） -->
  <circle cx="200" cy="356" r="14" fill="#ffffff" fill-opacity="0.85"/>
</svg>
</body>
</html>
