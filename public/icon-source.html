<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>拾音图标源稿 v3</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
</style>
</head>
<body>
<!-- 512x512 应用图标 v3：亮青蓝渐变圆角方块（透明背景）+ 白色圆角波形条 -->
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#7fd9f8"/>
      <stop offset="0.45" stop-color="#55b3ee"/>
      <stop offset="1" stop-color="#3f8fdc"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 圆角底：亮青蓝渐变，圆角外透明（无白底无边框） -->
  <rect x="14" y="14" width="484" height="484" rx="120" fill="url(#bg)"/>
  <!-- 顶部柔和高光 -->
  <rect x="14" y="14" width="484" height="230" rx="120" fill="url(#sheen)"/>

  <!-- 白色圆角波形条（5 根，中间高两侧低，包络成弧线） -->
  <g fill="#ffffff">
    <rect x="104" y="198" width="46" height="116" rx="23"/>
    <rect x="170" y="156" width="46" height="200" rx="23"/>
    <rect x="236" y="128" width="46" height="256" rx="23"/>
    <rect x="302" y="156" width="46" height="200" rx="23"/>
    <rect x="368" y="198" width="46" height="116" rx="23"/>
  </g>
</svg>
</body>
</html>
